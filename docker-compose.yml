services:

  # ── データベース（MySQL） ─────────────────────────
  db:
    # サーバーに既にある mysql:8.0 のイメージを再利用してディスクを節約する
    image: mysql:8.0
    container_name: pf_reiki_db
    restart: unless-stopped
    # 共有サーバーのメモリが少ないため、使用量に上限を付けて軽量設定にする
    mem_limit: 450m
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=30"]
    environment:
      # パスワードは同じフォルダの .env の DB_PASSWORD で指定できる（未指定なら root）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: myapp_db
      TZ: Asia/Tokyo
    # DBのポートは外部に公開しない（appコンテナからだけ db:3306 でつながる）
    volumes:
      - db_data:/var/lib/mysql
      # 初回起動時だけ実行される初期化SQL（テーブル作成＋初期データ投入）
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── アプリ（Tomcat + PF_Reiki） ───────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pf_reiki_app
    restart: unless-stopped
    # 共有サーバーのメモリが少ないため、使用量に上限を付ける
    mem_limit: 450m
    depends_on:
      db:
        condition: service_healthy
    environment:
      CATALINA_OPTS: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m"
      DB_HOST: db          # docker-compose内ではサービス名がホスト名になる
      DB_PORT: "3306"
      DB_NAME: myapp_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      # 左：外から見えるポート（サーバーの指定は 9156）／右：コンテナ内のTomcat（8080のまま）
      - "9156:8080"
    # お問い合わせの通知メールを使う場合は、
    # PF_Reiki/src/main/webapp/WEB-INF/mail.properties を作成してから
    # 下のvolumesのコメントを外してください（.gitignore対象なのでリポジトリには含まれません）。
    # volumes:
    #   - ./PF_Reiki/src/main/webapp/WEB-INF/mail.properties:/usr/local/tomcat/webapps/PF_Reiki/WEB-INF/mail.properties:ro

volumes:
  db_data:
